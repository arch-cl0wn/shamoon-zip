[build]
  command = "NITRO_PRESET=netlify bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"

# TanStack Start uses Nitro under the hood. The Netlify preset emits a
# Netlify Function for SSR plus static assets in /dist. The redirect below
# is auto-generated by Nitro, but we add a safety SPA fallback in case.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
